<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkalX Org Designer</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>

<section class="signin" id="sign-in" hidden>
  <form class="card-form" id="sign-in-form">
    <h1>SkalX Org Designer</h1>
    <p class="lede">Autentifică-te cu contul local.</p>
    <label class="field">Nume de utilizator<input id="username" autocomplete="username" required></label>
    <label class="field">Parolă<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Autentificare</button>
    <p class="form-message" id="sign-in-message" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="session-row">
      <div class="inline">
        <label class="inline" id="chart-picker">Organigramă <select id="chart-select"></select></label>
        <button class="btn" id="new-chart" type="button" data-action="new-chart">Organigramă nouă</button>
      </div>
      <div class="inline"><span id="session-label"></span><button class="btn" id="sign-out" type="button">Deconectare</button></div>
    </div>
    <h1 id="chart-title">SkalX Org Designer</h1>
    <p class="lede" id="lede"></p>
    <p class="principle" id="tagline" hidden></p>
  </header>

  <div class="bar" role="toolbar" aria-label="Controale organigramă">
    <div class="bar-in">
      <div class="seg" id="views"></div>
      <div class="grp" id="phase-group"><span>Faza</span><div class="seg" id="phases"></div></div>
      <input type="search" id="q" placeholder="Caută rol, KPI, responsabilitate" aria-label="Caută">
      <label class="chk" id="only-wrap"><input type="checkbox" id="only"> Doar modificările</label>
    </div>
  </div>

  <div class="notice" id="readonly-banner" hidden></div>
  <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

  <main id="workspace"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true"></aside>
</body>
</html>
